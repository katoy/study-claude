name: All Projects CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub Pages へのデプロイに必要な権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行制限（デプロイの競合防止）
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  # ファイル変更検知ジョブ
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      contact-form: ${{ steps.filter.outputs.contact-form }}
      example-001: ${{ steps.filter.outputs.example-001 }}
      todo-app: ${{ steps.filter.outputs.todo-app }}
      todo-app2: ${{ steps.filter.outputs.todo-app2 }}
      pdflabel: ${{ steps.filter.outputs.pdflabel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contact-form:
              - 'contact-form/**'
              - '.github/workflows/all-projects-ci.yml'
            example-001:
              - 'example-001/**'
              - '.github/workflows/all-projects-ci.yml'
            todo-app:
              - 'todo-app/**'
              - '.github/workflows/all-projects-ci.yml'
            todo-app2:
              - 'todo-app2/**'
              - '.github/workflows/all-projects-ci.yml'
            pdflabel:
              - 'pdflabel/**'
              - '.github/workflows/all-projects-ci.yml'

  # 1. Contact Form (Laravel & Node) CI
  contact-form-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.contact-form == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite3
          coverage: none

      - name: Copy .env file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        working-directory: contact-form/myproject

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: contact-form/myproject

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: contact-form/myproject

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contact-form/myproject/package-lock.json

      - name: Install NPM dependencies
        run: npm ci
        working-directory: contact-form/myproject

      - name: Generate Application Key
        run: php artisan key:generate
        working-directory: contact-form/myproject

      - name: Run Linter
        run: npm run lint
        working-directory: contact-form/myproject

      - name: Build Assets
        run: npm run build
        working-directory: contact-form/myproject

      - name: Run Tests
        run: npm run test
        working-directory: contact-form/myproject

  # 2. Example 001 (Node & Playwright) CI
  example-001-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.example-001 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example-001/package-lock.json

      - name: Install dependencies
        working-directory: example-001
        run: npm ci

      - name: Run Linter
        working-directory: example-001
        run: npm run lint

      - name: Install Playwright Browsers
        working-directory: example-001
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: example-001
        run: npm test

      - name: Upload Playwright report (on failure)
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-example-001
          path: example-001/playwright-report/
          retention-days: 30

  # 3. ToDo App (Node & Playwright) CI
  todo-app-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.todo-app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'todo-app/package-lock.json'

      - name: Install dependencies
        working-directory: todo-app
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: todo-app
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: todo-app
        run: npm test

      - name: Upload Playwright report (on failure)
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-todo-app
          path: todo-app/playwright-report/
          retention-days: 30

  # 4. ToDo App 2 (Node & Coverage & Build) CI
  todo-app2-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.todo-app2 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: todo-app2/package-lock.json

      - name: Install dependencies
        working-directory: todo-app2
        run: npm ci

      - name: Run Linter
        working-directory: todo-app2
        run: npm run lint

      - name: Run Formatter Check
        working-directory: todo-app2
        run: npm run format

      - name: Run Biome Check
        working-directory: todo-app2
        run: npm run biome:check

      - name: Run Tests with 100% Coverage Check
        working-directory: todo-app2
        run: npm run test:coverage

      - name: Build for Production
        working-directory: todo-app2
        run: npm run build

      - name: Verify Build Output
        working-directory: todo-app2
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: dist/index.html not found"
            exit 1
          fi
          echo "✅ Build successful: dist/index.html created"
          ls -lh dist/index.html

      - name: Install Playwright Browsers
        working-directory: todo-app2
        run: npx playwright install --with-deps chromium

      - name: Run VRT Tests
        working-directory: todo-app2
        run: npm run test:vrt

      - name: Upload Playwright report (on failure)
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-todo-app2
          path: todo-app2/playwright-report/
          retention-days: 30

  # 5. PDF Label CI
  pdflabel-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.pdflabel == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pdflabel/package-lock.json

      - name: Install dependencies
        working-directory: pdflabel
        run: npm ci

      - name: Run HTMLHint
        working-directory: pdflabel
        run: npx htmlhint index.html

      - name: Run tests with coverage
        working-directory: pdflabel
        run: npm run test:coverage

      - name: Generate Coverage Job Summary
        if: always()
        run: |
          SUMMARY_FILE="pdflabel/coverage/coverage-summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            echo "### 📊 pdflabel Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Category | Percentage | Covered / Total |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
            
            pct=$(jq '.total.statements.pct' $SUMMARY_FILE)
            covered=$(jq '.total.statements.covered' $SUMMARY_FILE)
            total=$(jq '.total.statements.total' $SUMMARY_FILE)
            echo "| **Statements** | ${pct}% | ${covered} / ${total} |" >> $GITHUB_STEP_SUMMARY
            
            pct=$(jq '.total.branches.pct' $SUMMARY_FILE)
            covered=$(jq '.total.branches.covered' $SUMMARY_FILE)
            total=$(jq '.total.branches.total' $SUMMARY_FILE)
            echo "| **Branches** | ${pct}% | ${covered} / ${total} |" >> $GITHUB_STEP_SUMMARY
            
            pct=$(jq '.total.functions.pct' $SUMMARY_FILE)
            covered=$(jq '.total.functions.covered' $SUMMARY_FILE)
            total=$(jq '.total.functions.total' $SUMMARY_FILE)
            echo "| **Functions** | ${pct}% | ${covered} / ${total} |" >> $GITHUB_STEP_SUMMARY
            
            pct=$(jq '.total.lines.pct' $SUMMARY_FILE)
            covered=$(jq '.total.lines.covered' $SUMMARY_FILE)
            total=$(jq '.total.lines.total' $SUMMARY_FILE)
            echo "| **Lines** | ${pct}% | ${covered} / ${total} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage summary file not found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload HTML Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdflabel-coverage-report
          path: pdflabel/coverage/
          retention-days: 14

  # 6. Deploy to GitHub Pages (CD)
  deploy:
    needs: [detect-changes, contact-form-ci, example-001-ci, todo-app-ci, todo-app2-ci, pdflabel-ci]
    if: |
      always() &&
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.detect-changes.outputs.todo-app2 == 'true' || 
       needs.detect-changes.outputs.pdflabel == 'true' || 
       needs.detect-changes.outputs.todo-app == 'true' || 
       needs.detect-changes.outputs.example-001 == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: todo-app2/package-lock.json

      - name: Install dependencies (todo-app2)
        working-directory: todo-app2
        run: npm ci

      - name: Build todo-app2
        working-directory: todo-app2
        run: npm run build

      - name: Prepare deployment structure
        run: |
          mkdir -p _deploy/todo-app2
          mkdir -p _deploy/pdflabel
          mkdir -p _deploy/todo-app
          mkdir -p _deploy/example-001
          
          # Copy todo-app2 build
          if [ -d "todo-app2/dist" ]; then
            cp -r todo-app2/dist/* _deploy/todo-app2/
          fi
          
          # Copy pdflabel static files
          if [ -f "pdflabel/index.html" ]; then
            cp pdflabel/index.html _deploy/pdflabel/index.html
            cp pdflabel/labellist.js _deploy/pdflabel/labellist.js
            cp pdflabel/robots.txt _deploy/pdflabel/robots.txt || true
          fi

          # Copy todo-app static files
          if [ -f "todo-app/index.html" ]; then
            cp todo-app/index.html _deploy/todo-app/index.html
          fi

          # Copy example-001 static game files
          if [ -d "example-001/game" ]; then
            cp -r example-001/game/* _deploy/example-001/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
