name: Contact Form CI

on:
  push:
    branches: [ main ]
    paths:
      - 'contact-form/**'
      - '.github/workflows/contact-form-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'contact-form/**'

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite3
          coverage: none

      - name: Copy .env file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        working-directory: contact-form/myproject

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: contact-form/myproject

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: contact-form/myproject

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contact-form/myproject/package-lock.json

      - name: Install NPM dependencies
        run: npm ci
        working-directory: contact-form/myproject

      - name: Generate Application Key
        run: php artisan key:generate
        working-directory: contact-form/myproject

      - name: Run Linter
        run: npm run lint
        working-directory: contact-form/myproject

      - name: Run Tests
        run: npm run test
        working-directory: contact-form/myproject
